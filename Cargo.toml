[package]
name = "gemini-analyzer"
version = "0.1.0"
edition = "2021"
description = "A universal AI analysis library and CLI powered by Gemini CLI"
authors = ["yuuji"]
license = "MIT"
repository = "https://github.com/yuuji/gemini-analyzer"
keywords = ["gemini", "ai", "analysis", "pdf", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "gemini_analyzer"
path = "src/lib.rs"

[[bin]]
name = "gemini-analyzer"
path = "src/main.rs"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }

[target.'cfg(windows)'.dependencies]
# Windows-specific dependencies if needed

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
# Future: async support
# async = ["tokio"]
